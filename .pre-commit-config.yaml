repos:
  - repo: local
    hooks:
      # ── pre-commit: lint y formato (rápido) ──
      - id: ruff
        name: ruff lint
        entry: bash -c 'cd backend && poetry run ruff check --fix .'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd backend && poetry run ruff format .'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      # ── pre-push: tipos y tests ──
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && poetry run mypy app'
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: bash -c 'cd backend && poetry run pytest tests/ -x -q'
        language: system
        pass_filenames: false
        stages: [pre-push]
